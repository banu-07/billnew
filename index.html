<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Billing Software & Item Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      .print-shadow-none { shadow: none !important; box-shadow: none !important; }
    }
  </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">

  <!-- Navigation Tabs -->
  <div class="max-w-4xl mx-auto mb-6 no-print flex space-x-2 border-b border-gray-300 pb-2">
    <button id="tabBillingBtn" onclick="switchTab('billing')" class="px-4 py-2 font-bold text-blue-600 border-b-2 border-blue-600">Create Invoice</button>
    <button id="tabCatalogBtn" onclick="switchTab('catalog')" class="px-4 py-2 font-bold text-gray-500 hover:text-blue-600">Item Catalog</button>
  </div>

  <!-- VIEW 1: INVOICE GENERATOR -->
  <div id="billingView" class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md print-shadow-none">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">INVOICE</h1>
        <input type="text" id="invoiceNum" value="INV-001" class="border p-1 rounded mt-1 font-mono text-sm">
      </div>
      <div class="text-right">
        <input type="text" id="companyName" placeholder="Your Business Name" class="font-bold text-lg text-right block border-b mb-1">
        <input type="date" id="invoiceDate" class="border p-1 rounded text-sm">
      </div>
    </div>

    <!-- Customer Info -->
    <div class="mb-6">
      <label class="block font-medium text-gray-700 text-sm mb-1">Bill To:</label>
      <input type="text" id="clientName" placeholder="Customer Name" class="w-full border p-2 rounded mb-2">
      <textarea id="clientAddr" placeholder="Customer Address / GSTIN" class="w-full border p-2 rounded text-sm" rows="2"></textarea>
    </div>

    <!-- Items Table -->
    <table class="w-full mb-4 border-collapse" id="itemsTable">
      <thead>
        <tr class="bg-gray-100 text-left text-sm font-semibold">
          <th class="p-2">Item Description</th>
          <th class="p-2 w-20">Qty</th>
          <th class="p-2 w-28">Price (₹)</th>
          <th class="p-2 w-28">Total (₹)</th>
          <th class="p-2 w-12 no-print"></th>
        </tr>
      </thead>
      <tbody id="invoiceRows">
        <!-- Rows added dynamically -->
      </tbody>
    </table>

    <button onclick="addInvoiceRow()" class="no-print bg-gray-200 text-gray-700 px-3 py-1 rounded text-sm font-medium hover:bg-gray-300 mb-6">+ Add Item</button>

    <!-- Totals -->
    <div class="flex justify-end">
      <div class="w-64 space-y-2">
        <div class="flex justify-between text-sm">
          <span>Subtotal:</span>
          <span id="subtotal" class="font-mono">₹0.00</span>
        </div>
        <div class="flex justify-between items-center text-sm">
          <span>GST / Tax (%):</span>
          <input type="number" id="taxRate" value="18" class="w-16 border p-1 rounded text-right" oninput="calculateTotals()">
        </div>
        <div class="flex justify-between font-bold text-lg border-t pt-2">
          <span>Grand Total:</span>
          <span id="grandTotal" class="font-mono">₹0.00</span>
        </div>
      </div>
    </div>

    <div class="mt-6 flex justify-end space-x-3 no-print">
      <button onclick="window.print()" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700">Print / Save PDF</button>
    </div>
  </div>

  <!-- VIEW 2: ITEM CATALOG MANAGEMENT -->
  <div id="catalogView" class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md hidden">
    <h2 class="text-xl font-bold text-gray-800 mb-4">Saved Item Catalog</h2>
    
    <!-- Add New Item Form -->
    <div class="bg-gray-50 p-4 rounded border mb-6 flex flex-col sm:flex-row gap-3 items-end">
      <div class="flex-1 w-full">
        <label class="block text-xs font-semibold text-gray-600 mb-1">Item Description / Name</label>
        <input type="text" id="newItemName" placeholder="e.g. Brass Light Fixture" class="w-full border p-2 rounded text-sm">
      </div>
      <div class="w-full sm:w-32">
        <label class="block text-xs font-semibold text-gray-600 mb-1">Unit Price (₹)</label>
        <input type="number" id="newItemPrice" placeholder="0.00" step="0.01" class="w-full border p-2 rounded text-sm">
      </div>
      <button onclick="saveCatalogItem()" class="bg-green-600 text-white px-4 py-2 rounded text-sm font-bold hover:bg-green-700 w-full sm:w-auto">Save Item</button>
    </div>

    <!-- Catalog Table -->
    <table class="w-full border-collapse">
      <thead>
        <tr class="bg-gray-100 text-left text-sm font-semibold border-b">
          <th class="p-2">Item Name</th>
          <th class="p-2 w-32">Price (₹)</th>
          <th class="p-2 w-20 text-center">Action</th>
        </tr>
      </thead>
      <tbody id="catalogRows">
        <!-- Saved products populated here -->
      </tbody>
    </table>
  </div>

  <script>
    // State arrays stored in localStorage
    let itemCatalog = JSON.parse(localStorage.getItem('itemCatalog')) || [
      { name: "Sample Item A", price: 500.00 },
      { name: "Sample Item B", price: 1200.00 }
    ];

    document.getElementById('invoiceDate').valueAsDate = new Date();

    // Navigation Switcher
    function switchTab(tab) {
      if(tab === 'billing') {
        document.getElementById('billingView').classList.remove('hidden');
        document.getElementById('catalogView').classList.add('hidden');
        document.getElementById('tabBillingBtn').className = "px-4 py-2 font-bold text-blue-600 border-b-2 border-blue-600";
        document.getElementById('tabCatalogBtn').className = "px-4 py-2 font-bold text-gray-500 hover:text-blue-600";
      } else {
        document.getElementById('billingView').classList.add('hidden');
        document.getElementById('catalogView').classList.remove('hidden');
        document.getElementById('tabCatalogBtn').className = "px-4 py-2 font-bold text-blue-600 border-b-2 border-blue-600";
        document.getElementById('tabBillingBtn').className = "px-4 py-2 font-bold text-gray-500 hover:text-blue-600";
        renderCatalogTable();
      }
    }

    // ITEM CATALOG FUNCTIONS
    function saveCatalogItem() {
      const name = document.getElementById('newItemName').value.trim();
      const price = parseFloat(document.getElementById('newItemPrice').value) || 0;

      if (!name) return alert('Please enter an item name.');

      itemCatalog.push({ name, price });
      localStorage.setItem('itemCatalog', JSON.stringify(itemCatalog));
      
      document.getElementById('newItemName').value = '';
      document.getElementById('newItemPrice').value = '';
      renderCatalogTable();
      updateDropdownOptions();
    }

    function deleteCatalogItem(index) {
      itemCatalog.splice(index, 1);
      localStorage.setItem('itemCatalog', JSON.stringify(itemCatalog));
      renderCatalogTable();
      updateDropdownOptions();
    }

    function renderCatalogTable() {
      const tbody = document.getElementById('catalogRows');
      tbody.innerHTML = '';
      itemCatalog.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.className = "border-b text-sm";
        tr.innerHTML = `
          <td class="p-2">${item.name}</td>
          <td class="p-2 font-mono">₹${item.price.toFixed(2)}</td>
          <td class="p-2 text-center">
            <button onclick="deleteCatalogItem(${index})" class="text-red-500 hover:underline">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // INVOICE ROW FUNCTIONS
    function addInvoiceRow() {
      const tbody = document.getElementById('invoiceRows');
      const tr = document.createElement('tr');
      tr.className = "invoice-row";
      
      tr.innerHTML = `
        <td class="p-1">
          <select class="item-select w-full border p-1 rounded text-sm mb-1 no-print" onchange="autoFetchPrice(this)">
            <option value="">-- Select Saved Item or Type Below --</option>
            ${getCatalogOptions()}
          </select>
          <input type="text" class="item-desc w-full border p-1 rounded" placeholder="Item description">
        </td>
        <td class="p-1"><input type="number" class="item-qty w-full border p-1 rounded" value="1" min="1" oninput="calculateTotals()"></td>
        <td class="p-1"><input type="number" class="item-price w-full border p-1 rounded" value="0.00" step="0.01" oninput="calculateTotals()"></td>
        <td class="p-1 item-total font-mono font-semibold p-2">0.00</td>
        <td class="p-1 text-center no-print"><button onclick="removeInvoiceRow(this)" class="text-red-500 font-bold">×</button></td>
      `;
      tbody.appendChild(tr);
      calculateTotals();
    }

    function getCatalogOptions() {
      return itemCatalog.map((item, idx) => `<option value="${idx}">${item.name} (₹${item.price.toFixed(2)})</option>`).join('');
    }

    function updateDropdownOptions() {
      document.querySelectorAll('.item-select').forEach(select => {
        const currentVal = select.value;
        select.innerHTML = `<option value="">-- Select Saved Item or Type Below --</option>` + getCatalogOptions();
        select.value = currentVal;
      });
    }

    function autoFetchPrice(selectElem) {
      const selectedIndex = selectElem.value;
      const row = selectElem.closest('tr');
      if (selectedIndex !== "") {
        const selectedItem = itemCatalog[selectedIndex];
        row.querySelector('.item-desc').value = selectedItem.name;
        row.querySelector('.item-price').value = selectedItem.price.toFixed(2);
        selectElem.classList.add('hidden'); // Automatically hides the dropdown box once an item is picked
        calculateTotals();
      }
    }

    function removeInvoiceRow(btn) {
      const rows = document.querySelectorAll('#invoiceRows tr');
      if (rows.length > 1) {
        btn.closest('tr').remove();
        calculateTotals();
      }
    }

    function calculateTotals() {
      let subtotal = 0;
      document.querySelectorAll('#invoiceRows tr').forEach(row => {
        const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
        const price = parseFloat(row.querySelector('.item-price').value) || 0;
        const total = qty * price;
        row.querySelector('.item-total').innerText = total.toFixed(2);
        subtotal += total;
      });

      const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
      const grandTotal = subtotal + (subtotal * (taxRate / 100));

      document.getElementById('subtotal').innerText = '₹' + subtotal.toFixed(2);
      document.getElementById('grandTotal').innerText = '₹' + grandTotal.toFixed(2);
    }

    // Initialize initial row on load
    addInvoiceRow();
  </script>
</body>
</html>
